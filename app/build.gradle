plugins {
    id 'com.android.application'
}

android {
    namespace 'se.majid.fixgrammar'
    compileSdk 34

    defaultConfig {
        applicationId 'se.majid.fixgrammar'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // A fixed key kept in the repo so every build can be installed over the previous one.
    // Fine for a personal app that is not published on Google Play.
    signingConfigs {
        fixed {
            storeFile file('fixgrammar.keystore')
            storePassword 'fixgrammar'
            keyAlias 'fixgrammar'
            keyPassword 'fixgrammar'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
